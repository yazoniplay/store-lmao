<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Velora</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="announcement"><span>Free shipping on orders over €50</span><span>•</span><span>Easy returns</span><span>•</span><span>Secure checkout</span></div>
<header class="site-header"><a class="logo" href="index.html">VELORA</a><nav class="nav"><a href="index.html">Home</a><a href="catalog.html">Shop</a><a href="about.html">Our story</a><a href="faq.html">FAQ</a></nav><button class="cart-button" id="cartButton">Bag <span id="cartCount">0</span></button></header>
<main><section class="product-detail" id="productDetail"></section></main>
<footer class="footer"><div class="footer-brand"><a class="logo" href="index.html">VELORA</a><p>Better everyday, by design.</p></div><div class="footer-links"><a href="catalog.html">Shop</a><a href="about.html">Our story</a><a href="faq.html">FAQ</a></div><p class="copyright">© 2026 Velora. All rights reserved.</p></footer>
<aside class="cart-drawer" id="cartDrawer"><div class="cart-head"><h2>Your bag</h2><button id="closeCart">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-bottom"><div class="cart-total"><span>Total</span><strong id="cartTotal">€0.00</strong></div><button class="button button-dark full" id="checkoutButton">Checkout</button></div></aside><div class="overlay" id="overlay"></div><script src="script.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
const list=JSON.parse(localStorage.getItem("nova-products")||"[]");
const product=list.find(p=>String(p.id)===String(id));
const root=document.getElementById("productDetail");
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]));
if(!product){root.innerHTML='<div class="product-not-found"><p class="eyebrow">PRODUCT NOT FOUND</p><h1>That product has<br>moved on.</h1><a class="button button-dark" href="catalog.html">Back to shop</a></div>';}
else{document.title=product.name+" — Velora";root.innerHTML='<div class="product-detail-image"><img src="'+product.image+'" alt="'+esc(product.name)+'"></div><div class="product-detail-copy"><a class="back-link" href="catalog.html">← Back to shop</a><p class="eyebrow">VELORA / COLLECTION</p><h1>'+esc(product.name)+'</h1><div class="detail-price">€'+Number(product.price).toFixed(2)+'</div><p class="detail-description">'+esc(product.description||"Designed to make everyday life a little easier.")+'</p><div class="detail-actions"><button class="button button-dark" id="detailAdd">Add to bag</button><button class="button button-light" id="buyNow">Buy now</button></div><div class="detail-meta"><span>✓ Carefully selected</span><span>✓ Secure checkout</span><span>✓ Easy returns</span></div></div>';document.getElementById("detailAdd").onclick=()=>add(product.id);document.getElementById("buyNow").onclick=()=>{add(product.id);open();}}
</script></body></html>
