<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NOVA</title><link rel="stylesheet" href="style.css"></head><body><div class="announcement">Free shipping on orders over €50</div><header class="site-header"><a class="logo" href="index.html">NOVA</a><nav class="nav"><a href="catalog.html">Catalog</a><a href="about.html">About</a><a href="faq.html">FAQ</a></nav><button class="cart-button" id="cartButton">Cart <span id="cartCount">0</span></button></header><main><section class="product-detail" id="productDetail"></section></main><footer class="footer"><div><a class="logo" href="index.html">NOVA</a><p>Everyday products, without the clutter.</p></div><div class="footer-links"><a href="catalog.html">Catalog</a><a href="about.html">About</a><a href="faq.html">FAQ</a></div><p class="copyright">© 2026 NOVA</p></footer><aside class="cart-drawer" id="cartDrawer"><div class="cart-head"><h2>Your cart</h2><button id="closeCart">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-bottom"><div class="cart-total"><span>Total</span><strong id="cartTotal">€0.00</strong></div><button class="button button-dark full" id="checkoutButton">Checkout</button></div></aside><div class="overlay" id="overlay"></div><script src="script.js"></script><script>
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
const id=new URLSearchParams(location.search).get("id");const list=JSON.parse(localStorage.getItem("nova-products")||"null")||DEFAULT_PRODUCTS;const product=list.find(p=>String(p.id)===String(id));const root=document.getElementById("productDetail");
if(!product){root.innerHTML='<div class="product-not-found"><p class="eyebrow">Product not found</p><h1>That product is unavailable.</h1><a class="button button-dark" href="catalog.html">Back to catalog</a></div>';}else{document.title=product.name+" — NOVA";root.innerHTML='<div class="product-detail-image"><img src="'+product.image+'" alt="'+escapeHtml(product.name)+'"></div><div class="product-detail-copy"><a class="back-link" href="catalog.html">← Back to catalog</a><p class="eyebrow">NOVA collection</p><h1>'+escapeHtml(product.name)+'</h1><div class="detail-price">€'+Number(product.price).toFixed(2)+'</div><p class="detail-description">'+escapeHtml(product.description||"A practical everyday product designed with a clean, useful approach.")+'</p><div class="detail-actions"><button class="button button-dark" id="detailAdd">Add to cart</button><button class="button button-light" id="buyNow">Buy now</button></div><p class="detail-note">Free shipping on orders over €50.</p></div>';document.getElementById("detailAdd").onclick=()=>add(product.id);document.getElementById("buyNow").onclick=()=>{add(product.id);open();};}
</script></body></html>
