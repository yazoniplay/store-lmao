<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Admin — NOVA</title><link rel="stylesheet" href="style.css"></head><body class="admin-page"><header class="site-header"><a class="logo" href="index.html">NOVA</a><a class="cart-button" href="catalog.html">View store →</a></header><main class="admin-shell"><section class="admin-login" id="loginPanel"><p class="eyebrow">Private area</p><h1 style="font-size:54px;margin-bottom:22px">Store admin.</h1><div class="admin-form"><label for="adminPassword">Password</label><input id="adminPassword" type="password" placeholder="Enter password"><button class="button button-dark" id="loginButton">Log in</button><p id="loginError" class="admin-note" style="display:none">Incorrect password.</p></div></section><section class="admin-panel" id="adminPanel"><div class="admin-top"><div><p class="eyebrow">Dashboard</p><h1 style="font-size:54px">Products.</h1></div><div class="admin-actions"><button class="button button-dark" id="newProduct">Add product</button><button class="small-button" id="logout">Log out</button></div></div><form class="admin-form" id="productForm" style="display:none"><input type="hidden" id="productId"><label>Name<input id="productName" required></label><label>Price (€)<input id="productPrice" type="number" step="0.01" min="0" required></label><label>Image URL<input id="productImage" type="url" required></label><div class="admin-actions"><button class="button button-dark" type="submit">Save product</button><button class="small-button" type="button" id="cancelEdit">Cancel</button></div></form><div class="admin-grid" id="adminProducts"></div><a class="admin-back" href="catalog.html">← Back to catalog</a><p class="admin-note">This static version saves product changes in this browser. It does not publish a server-side product database.</p></section></main><script>const PASS_HASH="100653e5beb3d7fb7f6c7a403860ac658b453f10674cf4bcfe6b36a1ed8817a1";const DEFAULT_PRODUCTS=[{id:1,name:"Everyday Carry Organizer",price:29.99,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=82"},{id:2,name:"Minimal Desk Lamp",price:39.99,image:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=82"},{id:3,name:"Travel Essentials Bag",price:24.99,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=82"},{id:4,name:"Daily Water Bottle",price:22.99,image:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=900&q=82"},{id:5,name:"Compact Tech Stand",price:19.99,image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=82"},{id:6,name:"Home Storage Tray",price:17.99,image:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=82"}];let products=JSON.parse(localStorage.getItem("nova-products")||"null")||DEFAULT_PRODUCTS;const $=id=>document.getElementById(id);async function hash(v){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}function save(){localStorage.setItem("nova-products",JSON.stringify(products));render()}function render(){$("adminProducts").innerHTML=products.length?products.map(p=>'<article class="admin-product"><img src="'+p.image+'" alt=""><div><h3>'+p.name+'</h3><p>€'+Number(p.price).toFixed(2)+'</p></div><div class="admin-product-actions"><button class="small-button" data-edit="'+p.id+'">Edit</button><button class="small-button danger" data-delete="'+p.id+'">Delete</button></div></article>').join(""):'<p class="admin-note">No products yet.</p>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.delete));if(p&&confirm("Delete "+p.name+"?")){products=products.filter(x=>x.id!==p.id);save()}})}function edit(id){const p=products.find(x=>x.id===id);$("productId").value=p.id;$("productName").value=p.name;$("productPrice").value=p.price;$("productImage").value=p.image;$("productForm").style.display="grid";$("productName").focus()}$("loginButton").onclick=async()=>{if(await hash($("adminPassword").value)===PASS_HASH){$("loginPanel").style.display="none";$("adminPanel").classList.add("visible");render()}else $("loginError").style.display="block"};$("adminPassword").onkeydown=e=>{if(e.key==="Enter")$("loginButton").click()};$("newProduct").onclick=()=>{$("productForm").reset();$("productId").value="";$("productForm").style.display="grid";$("productName").focus()};$("cancelEdit").onclick=()=>{$("productForm").style.display="none"};$("logout").onclick=()=>location.reload();$("productForm").onsubmit=e=>{e.preventDefault();const id=Number($("productId").value),data={name:$("productName").value.trim(),price:Number($("productPrice").value),image:$("productImage").value.trim()};if(id){const i=products.findIndex(p=>p.id===id);if(i>-1)products[i]={...products[i],...data}}else products.push({id:Date.now(),...data});save();$("productForm").style.display="none"};</script></body></html>
